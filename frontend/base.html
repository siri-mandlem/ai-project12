<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Library Desk{% endblock %} | Library Desk</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/">Library Desk</a>
        <nav aria-label="Main navigation">
            {% if current_user %}
                <a href="/dashboard">Dashboard</a>
                <a href="/list-books">Books</a>
                <a href="/search-books">Search</a>
                <a href="/view-issued-books">My loans</a>
                <form class="nav-form" action="{{ url_for('main.logout') }}" method="post">
                    <button class="link-button" type="submit">Sign out</button>
                </form>
            {% else %}
                <a href="/login">Sign in</a>
                <a href="/register">Create account</a>
            {% endif %}
        </nav>
    </header>
    <main class="page">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <p class="flash {{ category }}" role="status">{{ message }}</p>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
    <script src="/static/js/script.js" defer></script>
</body>
</html>
