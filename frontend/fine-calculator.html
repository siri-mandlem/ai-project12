{% extends "base.html" %}
{% block title %}Fine calculator{% endblock %}
{% block content %}
<section class="card narrow">
    <p class="eyebrow">Borrowing help</p>
    <h1>Fine calculator</h1>
    <p>Loans are fine-free for 14 days. After that, the fine is $0.50 per late day.</p>
    <label for="days-late">Days late</label>
    <input type="number" id="days-late" min="0" step="1" value="0">
    <button type="button" data-calculate-fine>Calculate fine</button>
    <p class="fine-result" id="fine-amount" aria-live="polite">Estimated fine: $0.00</p>
</section>
{% endblock %}
